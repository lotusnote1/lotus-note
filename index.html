<style>
:root{color-scheme:light;--bg:#fff;--ink:#14224f;--navy:#0a1f63;--mut:#5d6a8f;--line:#f1d5e1;--pink:#f8518b;--pt:#cf2f6b;--pg:linear-gradient(135deg,#ff9cc0,#f8518b);--soft:#fff3f8;--f:"IBM Plex Sans Thai",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:400 16px/1.6 var(--f);background:#fff radial-gradient(700px 320px at 95% -5%,#ffe0ec,transparent),radial-gradient(520px 280px at 0 0,#e6eaff,transparent) no-repeat}
.w{max-width:760px;margin:0 auto;padding:18px 14px 110px}
.lg{mix-blend-mode:multiply}
.brand{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.brand img{height:54px;width:auto}
.wm{font:800 30px/1 "Baloo 2",system-ui,sans-serif}.wm i{font-style:normal;color:var(--navy)}.wm b{color:var(--pink)}
.sub{display:block;font:400 12px var(--f);color:var(--mut);margin-top:3px}
.sp{position:absolute;width:14px;height:14px}
.me{flex-basis:100%;font-size:13px;color:var(--mut);text-align:right}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;border-bottom:2px solid var(--line)}
.tabs button,.chip{font:500 14px var(--f);white-space:nowrap;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button[aria-current],.chip[aria-pressed=true]{color:#fff;background:var(--navy);border-color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px;box-shadow:0 2px 10px rgba(248,81,139,.08)}
.sj{border-top:4px solid var(--pink)}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px}.sh h2{margin:0;font:600 18px var(--f);color:var(--navy)}
.mut{color:var(--mut);font-size:14px}
.add{width:34px;height:34px;border-radius:50%;border:0;background:var(--pg);color:var(--navy);font:700 20px/1 var(--f);cursor:pointer}
.gh{background:none;border:0;color:var(--mut);font:14px var(--f);cursor:pointer;padding:4px 6px}.gh:hover{color:var(--pt)}
.en{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;cursor:pointer;user-select:none}
.en p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.en.done p{text-decoration:line-through;color:var(--mut)}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.new{background:var(--pg);color:var(--navy);font-size:12px;font-weight:700;border-radius:999px;padding:0 10px}
.ok{color:#1b8a58;font-size:13px}
.tg{display:inline-block;font-size:12px;border:1px solid var(--pink);color:var(--pt);border-radius:999px;padding:0 9px;margin:2px 4px 2px 0}
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.imgs img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.pst .imgs img{width:100%;height:auto;max-height:420px}.pst .imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--pg);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.ctr{text-align:center;color:var(--mut);padding:44px 10px}.ctr svg{width:70px;height:70px}
.fab{position:fixed;right:18px;bottom:20px;width:56px;height:56px;border-radius:50%;border:0;background:var(--pg);color:var(--navy);font:600 30px/1 var(--f);cursor:pointer;box-shadow:0 4px 16px rgba(248,81,139,.45)}
dialog{border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);padding:20px;width:min(440px,calc(100% - 24px));font-family:var(--f);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(15,33,103,.45)}
dialog h3{margin:0 0 10px;font:600 18px var(--f);color:var(--navy)}
label.f{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:400 16px var(--f);padding:9px 10px;border:1px solid #e6c9d6;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:90px}.row{display:grid;grid-template-columns:.8fr 1.5fr 1fr;gap:8px}
.btns{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.btn{font:500 15px var(--f);padding:9px 18px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
.btn.p{background:var(--pg);border-color:transparent;color:var(--navy);font-weight:600}.btn:disabled{opacity:.5}
.pick{position:relative;display:inline-block;overflow:hidden;font:500 15px var(--f);padding:9px 18px;border-radius:8px;background:var(--navy);color:#fff;cursor:pointer;margin-top:6px}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0}
.pv{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.pv img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.cb{display:flex;flex-wrap:wrap;gap:10px}.cb label{display:flex;gap:6px;align-items:center;font-size:14px}.cb input{width:auto}
#login{max-width:380px;margin:8vh auto;padding:0 18px}.lgm{display:block;width:min(340px,86vw);height:auto;margin:0 auto 10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:8px}.at{border-collapse:collapse;font-size:13px;min-width:100%}
.at th,.at td{border:1px solid var(--line);padding:3px 6px;text-align:center;white-space:nowrap}.at th{background:var(--soft);color:var(--navy)}
.at td.nm{text-align:left;position:sticky;left:0;background:#fff}.at td.c{min-width:28px;height:30px;color:var(--navy);font-weight:600}.at td.ed{cursor:pointer}.at td.ed:hover{background:#ffe3ee}.at .we{background:#eef1ff}
.shd{text-align:center;margin:10px 0 4px;font-size:14px}.shd b{display:block;margin-top:4px;font-size:16px;color:var(--navy)}
.ic{margin-left:auto;display:flex;gap:8px;align-self:flex-start}
.ib{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-current]{background:var(--navy);color:#fff}
.bd{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--pg);color:var(--navy);font:700 11px/19px var(--f);text-align:center;padding:0 5px}
.nt{display:flex;gap:12px;padding:12px 10px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}.nt.un{background:var(--soft)}.ni{font-size:24px;line-height:1.3}
.mg{background:#d8f5e3;color:#14804a}.mb{background:#dbe3ff;color:#0a1f63}.ms{background:#d6efff;color:#0b6fa8}.my{background:#fff1b8;color:#8a6500}.mr{background:#ffd9de;color:#c92a2a}.mx{background:#e4e7eb;color:#5f6b7a}
.mw{background:#fff;color:var(--navy);border:2px solid var(--line)}
.at td.mg,.at td.mb,.at td.ms,.at td.my,.at td.mr,.at td.mx{font-weight:700}
.at td.mg{background:#d8f5e3;color:#14804a}.at td.mb{background:#dbe3ff;color:#0a1f63}.at td.ms{background:#d6efff;color:#0b6fa8}.at td.my{background:#fff1b8;color:#8a6500}.at td.mr{background:#ffd9de;color:#c92a2a}.at td.mx{background:#e4e7eb;color:#5f6b7a}
.at .we{background:#eceff3}.at td.sm{text-align:left}.at tfoot td{background:var(--soft);font-size:12px;color:var(--mut)}
.sc{display:inline-block;border-radius:999px;padding:1px 9px;margin:2px 3px;font:600 12px var(--f);background:#f1f3f6;color:var(--mut)}
.sc.mg{background:#d8f5e3;color:#14804a}.sc.mb{background:#dbe3ff;color:#0a1f63}.sc.ms{background:#d6efff;color:#0b6fa8}.sc.my{background:#fff1b8;color:#8a6500}.sc.mr{background:#ffd9de;color:#c92a2a}.sc.mx{background:#e4e7eb;color:#5f6b7a}
.lgd{margin:6px 0}.ds{border:0;background:none;cursor:pointer;font-size:14px;padding:2px}
.bru{font:600 14px var(--f);border:2px solid transparent;border-radius:999px;padding:6px 14px;cursor:pointer;transition:transform .15s}
.bru[aria-pressed=true]{border-color:var(--navy);box-shadow:0 0 0 2px #fff inset,0 2px 8px rgba(10,31,99,.25)}
#splash{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s}
#splash.out{opacity:0;pointer-events:none}#splash .ldr{width:130px;height:130px}#splash .wm{font-size:34px;margin-top:4px}
.ldr{width:90px;height:90px}.ctr .ldr{width:96px;height:96px}
.ldr .rot{animation:none}
.ldr .lt{transform-origin:60px 64px;animation:pulse 2s ease-in-out infinite}
.ldr .tw1,.ldr .tw2{transform-box:fill-box;transform-origin:center;animation:tw 1.8s ease-in-out infinite}.ldr .tw2{animation-delay:.9s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.04)}}
@keyframes tw{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.15);opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fl{50%{transform:translateY(-4px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes ring{0%,55%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-12deg)}30%{transform:rotate(8deg)}40%{transform:rotate(-6deg)}}
@keyframes shine{to{background-position:200% 0}}
#v.enter>*{animation:up .4s ease both}#v.enter>*:nth-child(2){animation-delay:.05s}#v.enter>*:nth-child(3){animation-delay:.1s}#v.enter>*:nth-child(4){animation-delay:.15s}#v.enter>*:nth-child(5){animation-delay:.2s}#v.enter>*:nth-child(n+6){animation-delay:.25s}
.card,.chip,.btn,.tabs button,.add,.fab,.ib{transition:transform .15s,box-shadow .2s,background-color .2s}
.card:hover{box-shadow:0 6px 18px rgba(248,81,139,.16)}
.btn:active,.chip:active,.tabs button:active,.add:active,.fab:active,.ib:active,.bru:active{transform:scale(.94)}
.fab{animation:pop .5s .2s both}.fab:hover{transform:scale(1.08) rotate(90deg)}
.ib.ring svg{transform-origin:50% 8%;animation:ring 2.4s ease-in-out infinite}.bd{animation:pop .4s}
.brand img{animation:fl 4s ease-in-out infinite}.sp{animation:tw 2.4s ease-in-out infinite}.ctr svg.lot{animation:fl 3.5s ease-in-out infinite}
dialog[open]{animation:pop .25s ease}
.new{background-image:linear-gradient(90deg,#ff9cc0,#f8518b,#ff9cc0);background-size:200% 100%;animation:shine 2.6s linear infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
#splash[hidden]{display:none}.at tr.out td{background:#f1f3f6;color:#9aa1ad;font-size:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.gg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
.gb{border:1px solid var(--line);background:#fff;border-radius:16px;padding:20px 10px;font:inherit;color:var(--navy);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 2px 10px rgba(248,81,139,.08);transition:transform .15s}
.gb:active{transform:scale(.96)}.gb b{font:800 28px "Baloo 2",var(--f)}.gb span{color:var(--mut);font-size:13px}
.ct{margin:6px 0;color:var(--navy);font:600 20px var(--f)}.cc{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.sm2{color:var(--navy);font-weight:600;margin:10px 0 0;text-align:center;padding:0 24px}
.ctl .tabs,.ctl #bell{display:none}
#gr input,#gr select{padding:5px 6px;font-size:14px}
</style>
</head>
